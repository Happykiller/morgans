# docker-compose.yml
services:
  morgans:
    build: .
    container_name: morgans
    ports:
      - "8025:8000"
    env_file:
      - .env
      - .env.dev
    extra_hosts:
      - "host.docker.internal:host-gateway"

  morgans-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: morgans-dev
    ports:
      - "8025:8000"
    env_file:
      - .env
      - .env.dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - ./bulk:/app/bulk
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  morgans-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: morgans-worker
    env_file:
      - .env
      - .env.dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - ./bulk:/app/bulk
    command: ["python", "-m", "arq", "worker.WorkerSettings"]
