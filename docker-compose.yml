# docker-compose.yml
services:
  morgans:
    build: .
    container_name: morgans
    ports:
      - "8025:8000"
    env_file:
      - .env.dev

  morgans-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: morgans-dev
    ports:
      - "8025:8000"
    env_file:
      - .env.dev
    volumes:
      - .:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]